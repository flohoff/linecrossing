---

variables:
  LIBOSMIUM_STABLE_VERSION: v2.23.1
  NLOHMANN_STABLE_VERSION: v3.11.3
  PROTOZERO_STABLE_VERSION: v1.8.2
  DEBIAN_FRONTEND: "noninteractive"

build:trixie:git:stable:
  image: amd64/debian:trixie
  stage: build
  variables:
    GIT_BASE: https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.zz.de
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy git ca-certificates
    - git clone ${GIT_BASE}/mirror/osmcode/libosmium.git --branch ${LIBOSMIUM_STABLE_VERSION}
    - git clone ${GIT_BASE}/mirror/nlohmann-json --branch ${NLOHMANN_STABLE_VERSION}
    - git clone ${GIT_BASE}/mirror/protozero --branch ${PROTOZERO_STABLE_VERSION}
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy build-essential cmake cmake-data libboost-program-options-dev zlib1g-dev libbz2-dev libexpat1-dev liblz4-dev libspatialite-dev
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build

build:trixie:packages:
  image: amd64/debian:trixie
  stage: build
  script:
    - apt-get update
    - apt-get install --no-install-suggests --no-install-recommends -fuy build-essential cmake cmake-data libboost-program-options-dev zlib1g-dev libbz2-dev libexpat1-dev liblz4-dev libosmium2-dev libprotozero-dev nlohmann-json3-dev libspatialite-dev
    - mkdir build
    - ( cd build ; cmake .. )
    - make -C build

